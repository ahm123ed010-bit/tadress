<style>
:root{--n:#0b1f3a;--g:#c9a24b;--bg:#f5f3ee;--c:#fff;--t:#14213a;--m:#667085;--l:#e3dfd4;--ok:#1a7f4b;--bad:#b42318;box-sizing:border-box;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0a1626;--c:#122440;--t:#eef1f6;--m:#9aa8bf;--l:#23385a}}
:root[data-theme=dark]{--bg:#0a1626;--c:#122440;--t:#eef1f6;--m:#9aa8bf;--l:#23385a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:400 16px/1.7 'IBM Plex Sans Arabic',Tahoma,sans-serif}
a{color:var(--g);text-decoration:none}h1{font-size:26px;margin:0 0 4px}h2{font-size:19px;margin:0 0 10px}
.sh{display:flex;min-height:100vh}.sb{width:230px;background:var(--n);color:#fff;padding:20px 14px;display:flex;flex-direction:column;gap:4px;flex-shrink:0}
.sb .br{font-size:26px;font-weight:600;color:var(--g);margin-bottom:14px}.sb a{color:#dfe6f2;padding:8px 12px;border-radius:8px}.sb a.on{background:var(--g);color:var(--n);font-weight:600}
.sb .ft{margin-top:auto;font-size:14px;color:#9fb0cb;display:grid;gap:6px}.mn{flex:1;padding:24px;max-width:960px;min-width:0}
.card{background:var(--c);border:1px solid var(--l);border-radius:14px;padding:18px;margin:0 0 16px}
label{display:grid;gap:4px;font-size:14px;color:var(--m);margin:0 0 10px}
input,select,textarea{font:inherit;padding:9px 11px;border:1px solid var(--l);border-radius:9px;background:var(--bg);color:var(--t);width:100%}
.b{font:inherit;font-weight:600;background:var(--n);color:#fff;border:0;border-radius:9px;padding:9px 16px;cursor:pointer}.b.g{background:transparent;color:var(--t);border:1px solid var(--l);padding:4px 10px;font-weight:400}
.b.y{background:var(--g);color:var(--n)}.b:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--g);outline-offset:2px}
.mu{color:var(--m);margin:0 0 14px}.er{color:var(--bad);min-height:24px;margin:0}.fl{background:#e6f4ec;color:var(--ok);padding:10px 14px;border-radius:9px;margin-bottom:14px;white-space:pre-line}.fl.x{background:#fdeceb;color:var(--bad)}
.gr{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}.st{background:var(--c);border:1px solid var(--l);border-radius:12px;padding:14px}.st b{font-size:28px;display:block;color:var(--g)}
table{width:100%;border-collapse:collapse}td,th{text-align:start;padding:8px;border-bottom:1px solid var(--l);font-size:15px}.ov{overflow-x:auto}
ul.ls{list-style:none;padding:0;margin:12px 0 0}ul.ls li{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--l)}
.present,.late{color:var(--ok)}.absent{color:var(--bad)}.excused{color:var(--g)}.qr{display:grid;place-items:center;background:#fff;padding:14px;border-radius:12px;max-width:280px;margin:0 auto 10px;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(201,162,75,.25)}}@media(prefers-reduced-motion:reduce){.qr{animation:none}}
code{direction:ltr;display:block;font-size:12px;word-break:break-all;color:var(--m);text-align:center}
.lg{display:grid;grid-template-columns:1fr 1fr;min-height:100vh}.lb{background:var(--n);color:#fff;padding:60px 40px;display:flex;flex-direction:column;justify-content:center}.lb h1{font-size:56px;color:var(--g)}
.lg form{align-self:center;justify-self:center;width:min(380px,90%)}.at{max-width:480px;margin:0 auto;padding:20px}.row{display:flex;gap:8px;flex-wrap:wrap}
video{width:100%;border-radius:12px;background:#000}
@media(max-width:760px){.sh{flex-direction:column}.sb{width:auto;flex-direction:row;flex-wrap:wrap;padding:10px}.sb .br{width:100%;margin:0}.sb .ft{flex-direction:row;flex-wrap:wrap;margin:0;width:100%}.lg{grid-template-columns:1fr}.lb{padding:30px 22px}.lb h1{font-size:40px}.mn{padding:14px}}

body{background:radial-gradient(900px 400px at 100% -10%,rgba(201,162,75,.12),transparent),var(--bg);-webkit-font-smoothing:antialiased}
.card{border-radius:18px;box-shadow:0 1px 2px rgba(11,31,58,.06),0 10px 30px rgba(11,31,58,.06);border-color:transparent}
.b{border-radius:12px;padding:10px 18px;transition:transform .15s,box-shadow .15s,filter .15s;background:linear-gradient(135deg,#0b1f3a,#1a3a66)}
.b:hover{filter:brightness(1.12);transform:translateY(-1px)}.b:active{transform:none}.b.g{background:transparent}.b.y{background:linear-gradient(135deg,#e2ba5c,#c9a24b);color:#0b1f3a}
input,select,textarea{border-radius:12px;padding:11px 13px;transition:border-color .15s,box-shadow .15s}input:focus,select:focus,textarea:focus{border-color:var(--g);box-shadow:0 0 0 3px rgba(201,162,75,.25);outline:0}
.sb{position:sticky;top:0;height:100vh;overflow-y:auto;background:linear-gradient(180deg,#0b1f3a,#12305a)}.sb .br{display:flex;align-items:center;gap:10px;font-size:24px}.sb .br img{border-radius:9px}
.sb a{transition:background .15s}.sb a:hover:not(.on){background:rgba(255,255,255,.08)}.sb a.on{background:linear-gradient(135deg,#e2ba5c,#c9a24b)}
.st{border-radius:16px;border-color:transparent;box-shadow:0 1px 2px rgba(11,31,58,.06),0 6px 18px rgba(11,31,58,.05);border-top:3px solid var(--g)}
tr:hover td{background:rgba(201,162,75,.07)}th{color:var(--m);font-weight:600;font-size:13px}
.lb{background:radial-gradient(500px 400px at 20% 90%,rgba(201,162,75,.28),transparent),linear-gradient(160deg,#0b1f3a,#16335c)}.lb img{border-radius:20px;margin-bottom:18px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.lg form{box-shadow:0 20px 50px rgba(11,31,58,.15);padding:26px}
@media(max-width:760px){.sb{position:static;height:auto;flex-direction:row;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;gap:6px;padding:10px 12px}.sb a,.sb .ft{flex-shrink:0;white-space:nowrap}.sb .br{width:auto}.sb .ft{width:auto;flex-direction:row;align-items:center}.mn{padding:14px 12px}.card{padding:14px}h1{font-size:22px}}
.sb a{display:flex;align-items:center;gap:10px}.sb a svg{flex-shrink:0;opacity:.9}
td,th{padding:12px 10px}tr:last-child td{border-bottom:0}th{text-transform:uppercase;letter-spacing:.02em}
.st b{background:linear-gradient(135deg,#b8913c,#e2ba5c);-webkit-background-clip:text;background-clip:text;color:transparent}
.b.pd{color:var(--ok);border-color:var(--ok);background:rgba(26,127,75,.1)}.b.np{color:var(--bad);border-color:var(--bad);background:rgba(180,35,24,.08)}
ul.ls li{padding:11px 4px;border-radius:10px}ul.ls li:hover{background:rgba(201,162,75,.07)}
@media print{.sb,.b,select,.row{display:none!important}.sh{display:block}.card,.st{box-shadow:none;border:1px solid #ccc}}
